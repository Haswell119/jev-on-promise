[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/haswell119/jev-on-promise"
authors = ["Sextant contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
indexmap = { version = "2.14", features = ["serde"] }
thiserror = "2.0"
regex = "1.13"
aho-corasick = "1.1"
unicode-normalization = "0.1"
rust-stemmers = "1.2"
rayon = "1.12"
rustc-hash = "2.1"
smallvec = "1.15"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
axum = { version = "0.8", features = ["json", "query"] }
tower-http = { version = "0.6", features = ["limit", "trace", "cors", "timeout"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4.6", features = ["derive", "env"] }
proptest = "1.11"
criterion = { version = "0.5", features = ["html_reports"] }
sextant-core = { path = "crates/core" }
sextant-server = { path = "crates/server" }

[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 16
panic = "unwind"

[profile.bench]
inherits = "release"
debug = true
