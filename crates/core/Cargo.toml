[package]
name = "sextant-core"
description = "Sextant: a deterministic, calibrated, fully local probabilistic decision engine (Choice / Score / Noul)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["neural"]
# Local neural decision scorer (candle + tokenizers). Disabling it yields a
# pure symbolic build with no tensor dependencies.
neural = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
thiserror.workspace = true
regex.workspace = true
aho-corasick.workspace = true
unicode-normalization.workspace = true
rust-stemmers.workspace = true
rayon.workspace = true
rustc-hash.workspace = true
smallvec.workspace = true
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "layers"
harness = false
