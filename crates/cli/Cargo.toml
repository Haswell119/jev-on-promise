[package]
name = "sextant"
description = "Sextant CLI: serve, decide, validate, bench, eval, train, calibrate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "sextant"
path = "src/main.rs"

[features]
default = ["neural"]
neural = ["sextant-core/neural", "sextant-server/neural"]

[dependencies]
sextant-core = { workspace = true, default-features = false }
sextant-server = { workspace = true, default-features = false }
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
tokio.workspace = true
clap.workspace = true
rayon.workspace = true
rustc-hash.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
